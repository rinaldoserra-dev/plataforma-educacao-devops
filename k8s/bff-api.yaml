apiVersion: v1
kind: Service
metadata:
  name: bff-api
  namespace: plataforma-educacao
spec:
  type: ClusterIP
  selector:
    app: bff-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-api
  namespace: plataforma-educacao
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff-api
  template:
    metadata:
      labels:
        app: bff-api
    spec:
      initContainers:
        - name: wait-identidade
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z gestao-identidade-api 8080; do echo "waiting for gestao-identidade-api"; sleep 2; done']
      containers:
        - name: bff-api
          image: rinaldoserra/plataforma-educacao-bff-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: plataforma-config
            - secretRef:
                name: plataforma-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
