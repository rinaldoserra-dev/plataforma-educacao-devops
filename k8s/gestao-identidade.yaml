apiVersion: v1
kind: Service
metadata:
  name: gestao-identidade-api
  namespace: plataforma-educacao
spec:
  type: ClusterIP
  selector:
    app: gestao-identidade-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestao-identidade-api
  namespace: plataforma-educacao
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gestao-identidade-api
  template:
    metadata:
      labels:
        app: gestao-identidade-api
    spec:
      containers:
        - name: gestao-identidade-api
          image: rinaldoserra/plataforma-educacao-gestao-identidade-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: plataforma-config
            - secretRef:
                name: plataforma-secret
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: plataforma-secret
                  key: ConnectionStrings__GestaoIdentidade
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/ready
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
