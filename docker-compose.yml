services:
  cert-generator:
    image: alpine:3.20
    container_name: plataforma-cert-generator

    volumes:
      - certificates-data:/certificates
      - ./certificates/sqlserver.cnf:/config/sqlserver.cnf:ro

    command: >
      /bin/sh -c "
      apk add --no-cache openssl &&

      if [ ! -f /certificates/root-ca.crt ]; then
        echo 'Gerando certificados...';

        openssl genrsa -out /certificates/root-ca.key 2048 &&

        openssl req -x509 -new -nodes -key /certificates/root-ca.key -sha256 -days 3650 -out /certificates/root-ca.crt -subj '/CN=PlataformaEducacao-Root-CA' &&

        openssl genrsa -out /certificates/sqlserver.key 2048 &&

        openssl req -new -key /certificates/sqlserver.key -out /certificates/sqlserver.csr -config /config/sqlserver.cnf &&

        openssl x509 -req -in /certificates/sqlserver.csr -CA /certificates/root-ca.crt -CAkey /certificates/root-ca.key -CAcreateserial -out /certificates/sqlserver.crt -days 825 -sha256 -extensions req_ext -extfile /config/sqlserver.cnf &&

        chmod 644 /certificates/root-ca.crt &&
        chmod 644 /certificates/sqlserver.crt &&
        chmod 644 /certificates/sqlserver.key &&
        chmod 600 /certificates/root-ca.key &&

        echo 'Certificados gerados com sucesso.';
      else
        echo 'Certificados já existem.';
      fi
      "
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: plataforma-sqlserver
    
    depends_on:
      cert-generator:
        condition: service_completed_successfully

    volumes:
      - sqlserver-data:/var/opt/mssql
      - certificates-data:/var/opt/mssql/certs:ro
      - ./certificates/mssql.conf:/var/opt/mssql/mssql.conf:ro
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Plataforma@2026
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Plataforma@2026' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - plataforma-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: plataforma-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - plataforma-network

  gestao-identidade-api:
    build:
      context: .
      dockerfile: src/services/GestaoIdentidade/PlataformaEducacao.GestaoIdentidade.Api/Dockerfile
    container_name: plataforma-identidade
    restart: unless-stopped
    ports:
      - "5430:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - APP_DLL=PlataformaEducacao.GestaoIdentidade.Api.dll
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=GestaoIdentidade;User Id=sa;Password=Plataforma@2026;Encrypt=True;TrustServerCertificate=False
      - MessageQueueConnection__MessageBus=host=rabbitmq:5672;publisherConfirms=true;timeout=10
    volumes:
      - ./logs/identidade:/app/logs
      - certificates-data:/certificates:ro
    networks:
      - plataforma-network
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  gestao-financeira-api:
    build:
      context: .
      dockerfile: src/services/GestaoFinanceira/PlataformaEducacao.GestaoFinanceira.Api/Dockerfile
    container_name: plataforma-financeira
    restart: unless-stopped
    ports:
      - "7083:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - APP_DLL=PlataformaEducacao.GestaoFinanceira.Api.dll
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=GestaoFinanceira;User Id=sa;Password=Plataforma@2026;Encrypt=True;TrustServerCertificate=False
      - MessageQueueConnection__MessageBus=host=rabbitmq:5672;publisherConfirms=true;timeout=10
    volumes:
      - ./logs/financeira:/app/logs
      - certificates-data:/certificates:ro
    networks:
      - plataforma-network
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  gestao-aluno-api:
    build:
      context: .
      dockerfile: src/services/GestaoAluno/PlataformaEducacao.GestaoAluno.Api/Dockerfile
    container_name: plataforma-aluno
    restart: unless-stopped
    ports:
      - "5460:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - APP_DLL=PlataformaEducacao.GestaoAluno.Api.dll
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=GestaoAluno;User Id=sa;Password=Plataforma@2026;Encrypt=True;TrustServerCertificate=False
      - MessageQueueConnection__MessageBus=host=rabbitmq:5672;publisherConfirms=true;timeout=10
    volumes:
      - ./logs/aluno:/app/logs
      - certificates-data:/certificates:ro
    networks:
      - plataforma-network
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  gestao-conteudo-api:
    build:
      context: .
      dockerfile: src/services/GestaoConteudo/PlataformaEducacao.GestaoConteudo.Api/Dockerfile
    container_name: plataforma-conteudo
    restart: unless-stopped
    ports:
      - "5440:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - APP_DLL=PlataformaEducacao.GestaoConteudo.Api.dll
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=GestaoConteudo;User Id=sa;Password=Plataforma@2026;Encrypt=True;TrustServerCertificate=False
      - MessageQueueConnection__MessageBus=host=rabbitmq:5672;publisherConfirms=true;timeout=10
    volumes:
      - ./logs/conteudo:/app/logs
      - certificates-data:/certificates:ro
    networks:
      - plataforma-network
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  bff-api:
    build:
      context: .
      dockerfile: src/api-gateways/PlataformaEducacao.Bff.Api/Dockerfile
    container_name: plataforma-bff
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    volumes:
      - ./logs/bff:/app/logs
    networks:
      - plataforma-network
    depends_on:
      - gestao-identidade-api

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: plataforma-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    networks:
      - plataforma-network
    depends_on:
      - bff-api
      - gestao-identidade-api
      - gestao-conteudo-api
      - gestao-aluno-api
      - gestao-financeira-api

  grafana:
    image: grafana/grafana:12.1.1
    container_name: plataforma-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/plataforma-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - plataforma-network
    depends_on:
      - prometheus

networks:
  plataforma-network:
    driver: bridge

volumes:
  sqlserver-data:
  prometheus-data:
  grafana-data:
  certificates-data: